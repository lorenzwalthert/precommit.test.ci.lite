on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - uses: r-lib/actions/setup-r@v2
    - uses: pre-commit/action@v3.0.1
    - uses: pre-commit-ci/lite-action@v1.2.0
      if: always()
